version: "3.3"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /tmp/videocut
    volumes:
      - videocut_tmp:/tmp/videocut
    ports:
      - "8000:8000"
    depends_on:
      - redis

  bot:
    build:
      context: ../bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      MINI_APP_URL: ${MINI_APP_URL}
      TEMP_DIR: /tmp/videocut
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS}
    volumes:
      - videocut_tmp:/tmp/videocut
    depends_on:
      - api
      - redis

  worker:
    build:
      context: ../worker
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /tmp/videocut
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS}
    volumes:
      - videocut_tmp:/tmp/videocut
    depends_on:
      - redis

  miniapp:
    build:
      context: ../miniapp
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  videocut_tmp:
