version: "3.3"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /tmp/videocut
    volumes:
      - videocut_tmp:/tmp/videocut
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - redis

  bot:
    build:
      context: ../bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      MINI_APP_URL: ${MINI_APP_URL}
      TEMP_DIR: /tmp/videocut
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8081}
    volumes:
      - videocut_tmp:/tmp/videocut
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - api
      - redis

  worker:
    build:
      context: ../worker
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /tmp/videocut
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS}
      MAX_OUTPUT_SIZE_BYTES: ${MAX_OUTPUT_SIZE_BYTES:-52428800}
    volumes:
      - videocut_tmp:/tmp/videocut
    depends_on:
      - redis

  miniapp:
    build:
      context: ../miniapp
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  videocut_tmp:
  redis_data:
